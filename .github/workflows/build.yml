name: Build installateurs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Tests
        run: npm test

      - name: Construire l'installateur Windows
        run: npm run dist:installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Récupérer le nom du tag
        if: startsWith(github.ref, 'refs/tags/')
        id: tagname
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: installateur-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

      - name: Attacher à la Release (si tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
          body: |
            Application Mathématiques v${{ steps.tagname.outputs.version }}

            L'installateur Windows se trouve en bas de page (fichier .exe). La mise à jour automatique s'appuie sur le fichier latest.yml — ne le supprimez pas.

            Une fois l'app installée, les futures mises à jour se proposent directement à l'intérieur de l'application (bannière en bas de la barre latérale), sans passer par GitHub.

            ### Nouveautés

            - À compléter.
