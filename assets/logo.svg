<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2d3a"/>
      <stop offset="1" stop-color="#1e1e28"/>
    </linearGradient>
    <linearGradient id="pageG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#e9e6df"/>
    </linearGradient>
    <linearGradient id="pageD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f1ec"/>
      <stop offset="1" stop-color="#ddd9d0"/>
    </linearGradient>
    <linearGradient id="sigma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fc1ff"/>
      <stop offset="1" stop-color="#73c99a"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#fond)"/>

  <!-- Ombre du livre -->
  <path d="M256 148 C 208 112, 136 108, 96 122 L 96 372 C 136 358, 208 362, 256 398 C 304 362, 376 358, 416 372 L 416 122 C 376 108, 304 112, 256 148 Z" fill="#000" opacity="0.35"/>

  <!-- Pages du livre ouvert -->
  <path d="M256 150 C 209 116, 139 112, 100 126 L 100 368 C 139 354, 209 358, 256 392 Z" fill="url(#pageG)"/>
  <path d="M256 150 C 303 116, 373 112, 412 126 L 412 368 C 373 354, 303 358, 256 392 Z" fill="url(#pageD)"/>

  <!-- Tranches fines -->
  <path d="M100 126 L 100 368 C 139 354, 209 358, 256 392" fill="none" stroke="#c8c3b8" stroke-width="6" stroke-linecap="round"/>
  <path d="M412 126 L 412 368 C 373 354, 303 358, 256 392" fill="none" stroke="#b5afa2" stroke-width="6" stroke-linecap="round"/>

  <!-- Lignes de texte (gauche) -->
  <g stroke="#a49c8c" stroke-width="9" stroke-linecap="round" opacity="0.75">
    <path d="M132 172 C 160 164, 200 166, 228 182"/>
    <path d="M132 208 C 160 200, 200 202, 228 218"/>
    <path d="M132 244 C 160 236, 200 238, 228 254"/>
    <path d="M132 280 C 160 272, 200 274, 228 290"/>
    <path d="M132 316 C 160 308, 200 310, 228 326"/>
  </g>

  <!-- Lignes de texte (droite) -->
  <g stroke="#9a9384" stroke-width="9" stroke-linecap="round" opacity="0.6">
    <path d="M284 182 C 312 166, 352 164, 380 172"/>
    <path d="M284 218 C 312 202, 352 200, 380 208"/>
    <path d="M284 254 C 312 238, 352 236, 380 244"/>
    <path d="M284 290 C 312 274, 352 272, 380 280"/>
    <path d="M284 326 C 312 310, 352 308, 380 316"/>
  </g>

  <!-- Sigma classique au centre -->
  <path d="M348 170 L 176 170 L 262 256 L 176 342 L 348 342"
        fill="none" stroke="url(#sigma)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
